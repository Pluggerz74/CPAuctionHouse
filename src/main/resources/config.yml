# CPAuctionHouse default configuration
# Documentation: CONFIGURATION.md

# Storage backend: sqlite (default) or mysql
storage:
  type: sqlite
  # If mysql fails to connect, fall back to SQLite when true
  fallback-to-sqlite-on-error: false

# SQLite settings (recommended for small/medium servers)
sqlite:
  file: auctionhouse.db

# MySQL/MariaDB settings (recommended for large servers/networks)
mysql:
  host: localhost
  port: 3306
  database: cpauctionhouse
  username: root
  password: ""
  pool-size: 10
  use-ssl: false
  connection-timeout-ms: 10000
  max-lifetime-ms: 1800000
  idle-timeout-ms: 600000
  parameters: "useUnicode=true&characterEncoding=utf8"

economy:
  # Require Vault with a registered economy provider
  require-vault: true

settings:
  language: de
  debug: false

auction:
  enabled: true
  listings:
    max-active-per-player: 10
    duration-hours: 72
    min-price: 1.0
    max-price: 1000000000.0
    allow-own-purchase: false
    # Material names blocked from listing (e.g. BEDROCK)
    blocked-materials: []
  economy:
    listing-fee: 0.0
    sale-tax-percent: 5.0
  confirmations:
    expensive-purchase-threshold: 10000.0
  cleanup:
    expire-check-interval-seconds: 60
    old-listing-retention-days: 30
  browse:
    page-size: 8
  gui:
    enabled: true
    title: "&6Auktionshaus"
    refresh-cooldown-ms: 750
    anvil-price-input: true
    anvil-price-title: "&6Preis eingeben"
    anvil-price-initial-text: "100"
    anvil-search-input: true
    anvil-search-title: "&6Suche eingeben"
    anvil-search-initial-text: "Suche"
    # NEWEST, OLDEST, PRICE_LOW_TO_HIGH, PRICE_HIGH_TO_LOW, ENDING_SOON
    default-sort: "NEWEST"
    info-button-cooldown-seconds: 5
    rows:
      main: 3
      browse: 6
      listings: 6
      collect: 6
    refresh-after-action: true
    confirmation:
      enabled: true
    filler:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
    sell:
      enabled: false
      use-anvil-price-input: true
      return-to-main-after-create: false
      open-listings-after-create: true
    browse:
      default-sort: newest
      show-refresh-button: true
      show-sort-button: true
  debug: false
